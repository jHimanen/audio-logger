[project]
name = "audio-logger"
version = "0.1.0"
description = "Record speech in the browser, transcribe it, save it as Markdown."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "httpx",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
